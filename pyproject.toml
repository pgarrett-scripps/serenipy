[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serenipy"
dynamic = ["version"]
description = "Python library for parsing IP2 proteomics file formats (MS2, SQT, DTASelect-filter, Census)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Patrick Garrett", email = "pgarrett@scripps.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "ty",
]

[project.urls]
Homepage = "https://github.com/pgarrett-scripps/serenipy"
Repository = "https://github.com/pgarrett-scripps/serenipy"
Issues = "https://github.com/pgarrett-scripps/serenipy/issues"
Changelog = "https://github.com/pgarrett-scripps/serenipy/blob/main/CHANGES"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "serenipy.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "ANN"]
# Deferred to follow-up PRs:
#   "B"  - flake8-bugbear (zip-strict, unused-loop-vars in legacy parsers)
#   "UP" - pyupgrade (modernize type hints to PEP 604/585 across all files)
ignore = [
    "E721",  # type() == comparisons in census.py legacy code
    "F841",  # unused locals in dtaselectfilter.py parser
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # tests don't need full type annotations

[tool.ty.src]
root = "./src"
